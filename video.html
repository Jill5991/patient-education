<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用藥指導影片</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans", sans-serif; }
    body { margin: 0; background: #f5f7f5; color: #17342c; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0 0 8px; }
    p { line-height: 1.6; }
    .card { background: white; border: 1px solid #d6e5dd; border-radius: 14px; padding: 20px; box-shadow: 0 2px 12px #153b2610; }
    .video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #16342c; border-radius: 8px; overflow: hidden; }
    iframe { position: absolute; width: 100%; height: 100%; border: 0; }
    .source { color: #4b6358; margin: 12px 0 4px; }
    .notice { background: #fff4da; border-left: 4px solid #a26300; padding: 10px 14px; margin-top: 18px; }
    a { color: #096849; }
    .link { display: inline-block; margin-top: 12px; font-weight: 650; }
    .back { display: block; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">用藥指導影片</h1>
    <p id="intro"></p>
    <div class="card" id="content" hidden>
      <div class="video" id="video"></div>
      <p class="source" id="source"></p>
      <a class="link" id="youtube" target="_blank" rel="noopener noreferrer"></a>
      <p class="notice" id="notice" hidden></p>
    </div>
    <p id="error" role="alert" hidden></p>
    <a class="back" id="back" href="index.html"></a>
  </main>
  <script>
    const labels = {
      "zh-TW": { heading: "用藥指導影片", intro: "請搭配用藥指導單張觀看操作示範。", open: "在 YouTube 觀看", back: "返回用藥指導單張", noVideo: "目前沒有適合這種語言與裝置的衛教影片；請參照單張並洽詢藥師。", error: "找不到影片資料。請向藥師確認。" },
      en: { heading: "Medication instruction video", intro: "Use this demonstration together with your instruction sheet.", open: "Watch on YouTube", back: "Return to instruction sheet", noVideo: "No suitable video is available for this language and device. Please use the sheet and ask your pharmacist.", error: "Video details could not be loaded. Please ask your pharmacist." },
      id: { heading: "Video petunjuk penggunaan obat", intro: "Gunakan video ini bersama lembar petunjuk obat Anda.", open: "Tonton di YouTube", back: "Kembali ke lembar petunjuk", noVideo: "Belum ada video yang sesuai untuk bahasa dan alat ini. Ikuti lembar petunjuk dan tanyakan kepada apoteker.", error: "Informasi video tidak dapat dimuat. Silakan tanya apoteker Anda." },
      vi: { heading: "Video hướng dẫn dùng thuốc", intro: "Xem video cùng với tờ hướng dẫn dùng thuốc.", open: "Xem trên YouTube", back: "Quay lại tờ hướng dẫn", noVideo: "Chưa có video phù hợp với ngôn ngữ và dụng cụ này. Hãy dùng tờ hướng dẫn và hỏi dược sĩ.", error: "Không tải được thông tin video. Vui lòng hỏi dược sĩ." },
      th: { heading: "วิดีโอแนะนำการใช้ยา", intro: "ดูวิดีโอควบคู่กับเอกสารแนะนำการใช้ยา", open: "ดูบน YouTube", back: "กลับไปยังเอกสารแนะนำ", noVideo: "ยังไม่มีวิดีโอที่เหมาะกับภาษาและอุปกรณ์นี้ โปรดอ่านเอกสารและสอบถามเภสัชกร", error: "โหลดข้อมูลวิดีโอไม่ได้ โปรดสอบถามเภสัชกร" },
      tl: { heading: "Video sa paggamit ng gamot", intro: "Gamitin ang video kasama ng gabay sa gamot.", open: "Panoorin sa YouTube", back: "Bumalik sa gabay sa gamot", noVideo: "Wala pang angkop na video para sa wikang ito at sa aparatong ito. Sundin ang gabay at magtanong sa parmasyutiko.", error: "Hindi ma-load ang impormasyon ng video. Magtanong sa parmasyutiko." },
      ja: { heading: "お薬の使い方動画", intro: "服薬指導シートと合わせて動画をご覧ください。", open: "YouTubeで見る", back: "服薬指導シートに戻る", noVideo: "この言語と器具に適した動画はまだありません。シートをご覧になり、薬剤師にご相談ください。", error: "動画情報を読み込めませんでした。薬剤師にご確認ください。" }
    };
    const clinicalReviewMessages = {
      "zh-TW": "這份單張的正式用藥步驟仍待藥師補正，目前沒有可提供的衛教影片。請向藥師確認使用方法。",
      en: "This sheet's medication instructions are awaiting pharmacist review. No video is available yet. Ask your pharmacist how to use this medicine.",
      id: "Petunjuk obat pada lembar ini masih menunggu peninjauan apoteker. Video belum tersedia. Tanyakan cara penggunaan obat kepada apoteker.",
      vi: "Hướng dẫn dùng thuốc trên tờ này đang chờ dược sĩ kiểm tra. Chưa có video. Hãy hỏi dược sĩ cách dùng thuốc.",
      th: "คำแนะนำในเอกสารนี้อยู่ระหว่างการตรวจสอบโดยเภสัชกร ยังไม่มีวิดีโอ โปรดสอบถามเภสัชกรก่อนใช้ยา",
      tl: "Hinihintay pa ng gabay na ito ang pagsusuri ng parmasyutiko. Wala pang video. Itanong sa parmasyutiko kung paano gamitin ang gamot.",
      ja: "このシートの服薬手順は薬剤師の確認待ちです。動画はまだありません。使い方は薬剤師に確認してください。"
    };
    const params = new URLSearchParams(location.search);
    const med = params.get("med");
    const lang = params.get("lang");
    const ui = labels[lang] || labels["zh-TW"];
    document.documentElement.lang = labels[lang] ? lang : "zh-TW";
    document.title = ui.heading;
    document.getElementById("heading").textContent = ui.heading;
    document.getElementById("intro").textContent = ui.intro;
    document.getElementById("back").textContent = ui.back;
    document.getElementById("back").href = `index.html?med=${encodeURIComponent(med || "trelegy-ellipta")}&lang=${encodeURIComponent(lang || "zh-TW")}`;

    async function showApprovedVideo() {
      try {
        const response = await fetch("approved-videos.json");
        if (!response.ok) throw new Error("Video registry unavailable");
        const registry = await response.json();
        const entry = registry[med]?.[lang];
        if (entry?.status === "clinical_review") {
          const message = document.getElementById("error");
          message.textContent = clinicalReviewMessages[lang] || clinicalReviewMessages["zh-TW"];
          message.hidden = false;
          return;
        }
        if (entry?.status === "no_suitable_video") {
          const message = document.getElementById("error");
          message.textContent = ui.noVideo;
          message.hidden = false;
          return;
        }
        if (!entry || !/^[A-Za-z0-9_-]{11}$/.test(entry.youtubeId)) throw new Error("No approved video");
        const start = Number.isSafeInteger(entry.startSeconds) && entry.startSeconds > 0 ? entry.startSeconds : 0;
        const youtube = `https://www.youtube.com/watch?v=${entry.youtubeId}${start ? `&t=${start}s` : ""}`;
        const frame = document.createElement("iframe");
        frame.src = `https://www.youtube-nocookie.com/embed/${entry.youtubeId}${start ? `?start=${start}` : ""}`;
        frame.title = entry.title;
        frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        frame.allowFullscreen = true;
        document.getElementById("video").append(frame);
        document.getElementById("source").textContent = `${entry.title} — ${entry.channel}`;
        const link = document.getElementById("youtube");
        link.href = youtube;
        link.textContent = ui.open;
        if (entry.notice) {
          const notice = document.getElementById("notice");
          notice.textContent = entry.notice;
          notice.hidden = false;
        }
        document.getElementById("content").hidden = false;
      } catch (error) {
        const message = document.getElementById("error");
        message.textContent = ui.error;
        message.hidden = false;
      }
    }
    showApprovedVideo();
  </script>
</body>
</html>
